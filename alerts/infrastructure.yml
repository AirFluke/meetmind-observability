groups:
  - name: infrastructure.rules
    interval: 60s
    rules:

      # ── Recording rules (pre-compute SLIs) ──────────────────────────────────
      - record: sli:node_memory_saturation
        expr: 1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)

      - record: sli:node_cpu_saturation
        expr: 1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m]))

      - record: sli:node_disk_usage
        expr: |
          1 - (
            node_filesystem_avail_bytes{mountpoint="/", fstype!="tmpfs"}
            / node_filesystem_size_bytes{mountpoint="/", fstype!="tmpfs"}
          )

      # ── CPU alerts ───────────────────────────────────────────────────────────
      - alert: HighCPUWarning
        expr: sli:node_cpu_saturation > 0.80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU utilisation is {{ $value | humanizePercentage }} (threshold: 80%)"
          value: "{{ $value | humanizePercentage }}"
          dashboard_url: "http://YOUR_SERVER_IP:3000/d/node-exporter/node-exporter"
          runbook_url: "https://github.com/AirFluke/meetmind-observability/blob/main/runbooks/high-cpu.md"

      - alert: HighCPUCritical
        expr: sli:node_cpu_saturation > 0.90
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Critical CPU usage on {{ $labels.instance }}"
          description: "CPU utilisation is {{ $value | humanizePercentage }} (threshold: 90%) for 10+ minutes"
          value: "{{ $value | humanizePercentage }}"
          dashboard_url: "http://YOUR_SERVER_IP:3000/d/node-exporter/node-exporter"
          runbook_url: "https://github.com/AirFluke/meetmind-observability/blob/main/runbooks/high-cpu.md"

      # ── Memory alerts ────────────────────────────────────────────────────────
      - alert: HighMemoryWarning
        expr: sli:node_memory_saturation > 0.80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: "Memory utilisation is {{ $value | humanizePercentage }} (threshold: 80%)"
          value: "{{ $value | humanizePercentage }}"
          dashboard_url: "http://YOUR_SERVER_IP:3000/d/node-exporter/node-exporter"
          runbook_url: "https://github.com/AirFluke/meetmind-observability/blob/main/runbooks/high-memory.md"

      - alert: HighMemoryCritical
        expr: sli:node_memory_saturation > 0.90
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Critical memory usage on {{ $labels.instance }}"
          description: "Memory utilisation is {{ $value | humanizePercentage }} (threshold: 90%)"
          value: "{{ $value | humanizePercentage }}"
          dashboard_url: "http://YOUR_SERVER_IP:3000/d/node-exporter/node-exporter"
          runbook_url: "https://github.com/AirFluke/meetmind-observability/blob/main/runbooks/high-memory.md"

      # ── Disk alerts ──────────────────────────────────────────────────────────
      - alert: DiskSpaceWarning
        expr: sli:node_disk_usage > 0.75
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Disk space warning on {{ $labels.instance }}"
          description: "Disk usage is {{ $value | humanizePercentage }} on {{ $labels.mountpoint }}"
          value: "{{ $value | humanizePercentage }}"
          dashboard_url: "http://YOUR_SERVER_IP:3000/d/node-exporter/node-exporter"
          runbook_url: "https://github.com/AirFluke/meetmind-observability/blob/main/runbooks/disk-space.md"

      - alert: DiskSpaceCritical
        expr: sli:node_disk_usage > 0.90
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Critical disk space on {{ $labels.instance }}"
          description: "Disk usage is {{ $value | humanizePercentage }} — system may become unresponsive soon"
          value: "{{ $value | humanizePercentage }}"
          dashboard_url: "http://YOUR_SERVER_IP:3000/d/node-exporter/node-exporter"
          runbook_url: "https://github.com/AirFluke/meetmind-observability/blob/main/runbooks/disk-space.md"

      # ── Host down (via Blackbox) ─────────────────────────────────────────────
      - alert: HostDown
        expr: probe_success == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Host {{ $labels.instance }} is down"
          description: "Blackbox probe failed for 2+ consecutive minutes. Service may be completely unreachable."
          value: "probe_success=0"
          dashboard_url: "http://YOUR_SERVER_IP:3000/d/blackbox/blackbox-exporter"
          runbook_url: "https://github.com/AirFluke/meetmind-observability/blob/main/runbooks/host-down.md"

      - alert: SSLCertExpiringSoon
        expr: probe_ssl_earliest_cert_expiry - time() < 86400 * 14
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "SSL certificate expiring on {{ $labels.instance }}"
          description: "Certificate expires in {{ $value | humanizeDuration }}"
          value: "{{ $value | humanizeDuration }}"
          runbook_url: "https://github.com/AirFluke/meetmind-observability/blob/main/runbooks/ssl-expiry.md"
